<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouvelle vignette</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0077b3}a:hover{color:#003a5d}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F9; font-family: Roboto, system-ui, sans-serif; color: #003a5d; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 64px; padding: 0 8px; background: #FFFFFF; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E3E8EF">
    <a href="2-personnaliser.html" aria-label="Fermer" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #003a5d">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700; flex: 1">Nouvelle vignette</h1>
  </header>

  <main style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 170px; height: 100px; flex: none; border-radius: 16px; padding: 13px; box-sizing: border-box; color: #FFFFFF; background: linear-gradient(135deg, #0E7490, #0891B2); display: flex; flex-direction: column; justify-content: space-between">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"></path></svg>
          En séchage
        </div>
        <div style="font-size: 30px; font-weight: 800; line-height: 1">6</div>
        <div style="font-size: 12px">chez les jeunes</div>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #4A6378">Aperçu en direct : 6 tentes correspondent aujourd'hui.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Nom
        <input value="En séchage" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #B8C6D2; border-radius: 10px; font: 400 15px Roboto, system-ui, sans-serif; color: #003a5d; background: #FFFFFF">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Sous-titre
        <input value="chez les jeunes" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #B8C6D2; border-radius: 10px; font: 400 15px Roboto, system-ui, sans-serif; color: #003a5d; background: #FFFFFF">
      </label>
    </div>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 500">Couleur et icône</legend>
      <div style="display: flex; align-items: center; gap: 10px">
        <button aria-label="Bleu" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #1D4ED8"></button>
        <button aria-label="Vert" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #047857"></button>
        <button aria-label="Orange" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #B45309"></button>
        <button aria-label="Turquoise, sélectionné" style="width: 32px; height: 32px; border-radius: 16px; border: 3px solid #FFFFFF; outline: 2px solid #0E7490; background: #0E7490"></button>
        <button aria-label="Violet" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #6D28D9"></button>
        <button aria-label="Rouge" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #9F1239"></button>
      </div>
      <div style="display: flex; gap: 8px">
        <button aria-label="Icône goutte, sélectionnée" style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #0E7490; background: #E0F2F7; color: #0E7490; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"></path></svg></button>
        <button aria-label="Icône tente" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D5DEE6; background: #FFFFFF; color: #4A6378; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20L12 4l9 16H3z"></path><path d="M12 4v16"></path></svg></button>
        <button aria-label="Icône outil" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D5DEE6; background: #FFFFFF; color: #4A6378; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6a4 4 0 0 0 5 5l-9 9-3-3 9-9a4 4 0 0 0-2-2z"></path></svg></button>
        <button aria-label="Icône validé" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D5DEE6; background: #FFFFFF; color: #4A6378; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg></button>
        <button aria-label="Icône interdit" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D5DEE6; background: #FFFFFF; color: #4A6378; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M6 6l12 12"></path></svg></button>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: none">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 500">Compter les tentes dont le statut est</legend>
      <div style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 14px; display: flex; flex-direction: column">
        <label style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-size: 15px; border-bottom: 1px solid #EEF2F6"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #0E7490"><span style="width: 10px; height: 10px; border-radius: 5px; background: #388E3C"></span>Correcte</label>
        <label style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-size: 15px; border-bottom: 1px solid #EEF2F6"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0E7490"><span style="width: 10px; height: 10px; border-radius: 5px; background: #0288D1"></span>Séchage + correcte</label>
        <label style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-size: 15px; border-bottom: 1px solid #EEF2F6"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0E7490"><span style="width: 10px; height: 10px; border-radius: 5px; background: #F57C00"></span>Séchage + réparation</label>
        <label style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-size: 15px; border-bottom: 1px solid #EEF2F6"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #0E7490"><span style="width: 10px; height: 10px; border-radius: 5px; background: #FFA000"></span>À réparer</label>
        <label style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #0E7490"><span style="width: 10px; height: 10px; border-radius: 5px; background: #C62828"></span>Hors service</label>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: none">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 500">Type de matériel <span style="font-weight: 400; color: #4A6378">(facultatif)</span></legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #003a5d; color: #FFFFFF; font: 500 14px Roboto, system-ui, sans-serif">Tous</button>
        <button style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #B8C6D2; background: #FFFFFF; color: #003a5d; font: 500 14px Roboto, system-ui, sans-serif">Canadienne</button>
        <button style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #B8C6D2; background: #FFFFFF; color: #003a5d; font: 500 14px Roboto, system-ui, sans-serif">Tipi</button>
        <button style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #B8C6D2; background: #FFFFFF; color: #003a5d; font: 500 14px Roboto, system-ui, sans-serif">Marabout</button>
      </div>
    </fieldset>
  </main>

  <div style="padding: 12px 16px 24px; background: #F4F6F9">
    <a href="1-accueil.html" style="min-height: 52px; border-radius: 26px; background: #003a5d; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Ajouter à l'accueil</a>
  </div>
</div>
</body>
</html>
